services:
  - type: web
    name: study-planner
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false   # you paste your Neon connection string in the Render dashboard
      - key: APP_PASSWORD
        sync: false   # set this to whatever password you want to log in with
      - key: APP_USERNAME
        value: admin  # optional — change if you want a different username
